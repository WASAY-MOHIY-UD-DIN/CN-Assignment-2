<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Research Opportunity Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
      <span class="navbar-brand mb-0 h1">University Research Opportunity Portal</span>
    </div>
  </nav>
  <div class="container">
<div class="d-flex justify-content-between align-items-center mb-3">
      <h4 class="mb-0">All Opportunities</h4>
      <button class="btn btn-success" id="btn-new">+ New Opportunity</button>
    </div>

    <div class="table-responsive bg-white shadow-sm rounded">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-dark">
          <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Faculty</th>
            <th>Area</th>
            <th>Positions</th>
            <th>Deadline</th>
            <th>Status</th>
            <th style="min-width: 260px">Actions</th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
  </div>

    </div>
</body>
</html>
